name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.13.7

      # PYTHONPATH: this change's source, with the engine the repository bundles.
      - name: Test the source
        env:
          PYTHONPATH: src
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/runtime-env
        run: |
          uv run --project releases/linux-x64/runtime --locked --with 'pytest>=8.3,<9' \
            python -m pytest -q -p no:cacheprovider
