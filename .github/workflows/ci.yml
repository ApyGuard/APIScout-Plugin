name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.13.7

      # PYTHONPATH: this change's source, with the engine the repository bundles.
      - name: Test the source
        env:
          PYTHONPATH: src
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/runtime-env
        run: |
          uv run --project releases/linux-x64/runtime --locked --with 'pytest>=8.3,<9' \
            python -m pytest -q -p no:cacheprovider
